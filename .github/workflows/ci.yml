name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.precision }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cc: [default]
        precision: [float]
        include:
          - os: ubuntu-latest
            cc: clang
            precision: float
          - os: ubuntu-latest
            cc: default
            precision: double

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cc }}" = "clang" ]; then export CC=clang; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAXXPID_STRICT=ON \
            -DAXXPID_USE_DOUBLE=${{ matrix.precision == 'double' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  cross-compile:
    name: arm-none-eabi (Cortex-M4F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      # The library must build for a real embedded target with no libc
      # startup, no libm and no heap.
      - name: Compile for Cortex-M4F
        run: |
          arm-none-eabi-gcc -c src/axxpid.c src/axxpid_tune.c \
            -Iinclude \
            -mcpu=cortex-m4 -mfpu=fpv4-sp-d16 -mfloat-abi=hard -mthumb \
            -std=c99 -Os -ffreestanding \
            -Wall -Wextra -Wpedantic -Wshadow -Wconversion \
            -Wdouble-promotion -Wstrict-prototypes -Wmissing-prototypes \
            -Werror

      - name: Report code size
        run: |
          arm-none-eabi-size -t axxpid.o axxpid_tune.o

  cross-compile-m0:
    name: arm-none-eabi (Cortex-M0+, no FPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Compile for Cortex-M0+
        run: |
          arm-none-eabi-gcc -c src/axxpid.c src/axxpid_tune.c \
            -Iinclude -mcpu=cortex-m0plus -mthumb \
            -std=c99 -Os -ffreestanding \
            -Wall -Wextra -Wpedantic -Werror
      - run: arm-none-eabi-size -t axxpid.o axxpid_tune.o

  c-standards:
    name: C99 / C11 / C17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile against each standard
        run: |
          for std in c99 c11 c17; do
            echo "=== $std ==="
            gcc -c src/axxpid.c src/axxpid_tune.c -Iinclude \
              -std=$std -Wall -Wextra -Wpedantic -Werror -o /dev/null
          done

  reserved-identifiers:
    name: No identifiers reserved to the implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # C reserves identifiers with a leading underscore; C++ reserves any
      # identifier containing a doubled underscore anywhere. These sources are
      # compiled by C++ toolchains too, so neither may appear -- except for
      # the compiler's own predefined macros, which we are meant to test.
      - name: Scan headers and sources
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          ALLOWED = re.compile(
              r"^__(FILE|LINE|DATE|TIME|func|VA_ARGS|cplusplus|STDC\w*|"
              r"GNUC\w*|clang\w*|has_\w+|attribute)(__)?$")
          IDENT = re.compile(r"_*[A-Za-z_][A-Za-z0-9_]*")

          bad = []
          for path in sorted(pathlib.Path("include").rglob("*.h")) +                       sorted(pathlib.Path("src").rglob("*.c")):
              text = path.read_text(encoding="utf-8")
              # Strip comments so prose about "__" does not trip the scan.
              text = re.sub(r"/\*.*?\*/", " ", text, flags=re.S)
              text = re.sub(r"//[^
]*", " ", text)
              for n, line in enumerate(text.splitlines(), 1):
                  for ident in IDENT.findall(line):
                      if ALLOWED.match(ident):
                          continue
                      if ident.startswith("_") or "__" in ident:
                          bad.append("%s:%d: %s" % (path, n, ident))

          if bad:
              for b in bad:
                  print("::error::reserved identifier -> " + b)
              sys.exit(1)
          print("clean: no reserved identifiers")
          PY

  cpp-compatibility:
    name: Usable from C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include the headers from a C++ translation unit
        run: |
          cat > cpp_check.cpp <<'CPP'
          #include "axxpid/axxpid.h"
          #include "axxpid/axxpid_tune.h"
          int main() {
              axxpid_t pid;
              axxpid_init(&pid, 1.0f, 1.0f, 0.0f);
              axxpid_set_output_limits(&pid, 0.0f, 100.0f);
              return axxpid_update(&pid, 10.0f, 0.0f, 0.1f) > 0.0f ? 0 : 1;
          }
          CPP
          g++ cpp_check.cpp src/axxpid.c src/axxpid_tune.c -Iinclude \
            -x none -Wall -Wextra -Werror -o cpp_check
          ./cpp_check
