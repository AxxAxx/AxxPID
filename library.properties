name=AxxPID
version=1.0.0
author=Axel Johansson <axeljohansson@duck.com>
maintainer=Axel Johansson <axeljohansson@duck.com>
sentence=Portable PID controller with feed-forward, filtered derivative and autotuning.
paragraph=A dependency-free PID controller in plain C99. Feed-forward (constant, setpoint-proportional, velocity and callback), two-degree-of-freedom setpoint weighting, a filtered derivative on measurement, selectable anti-windup, bumpless manual/automatic transfer, output slew limiting, and a relay autotuner with the classical tuning tables. No dynamic allocation, no globals, no vendor HAL.
category=Signal Input/Output
url=https://github.com/axeljohansson/AxxPID
architectures=*
includes=axxpid/axxpid.h
